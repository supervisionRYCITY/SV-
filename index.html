<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperVision+ | หน้าแรก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { brand: { blue: '#1e3a8a', green: '#15803d', yellow: '#eab308' } } } } }
  </script>
  <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-30 hidden lg:hidden transition-opacity"></div>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex flex-col h-full overflow-hidden transition-all duration-300 mr-0 lg:mr-64">
    <header class="bg-brand-blue text-white shadow-md px-6 py-4 flex justify-between items-center z-10 border-b-4 border-brand-yellow">
      <div>
        <h1 class="text-xl font-bold">หน้าแรก</h1>
        <p class="text-xs text-blue-200">SuperVision+ ระบบสารสนเทศเพื่อการบริหารงานศึกษานิเทศ</p>
      </div>
      <div class="flex items-center space-x-4">
        <div id="user-info-display" class="text-right hidden">
          <div id="user-name" class="font-semibold text-sm text-yellow-300"></div>
          <div id="user-role" class="text-xs text-slate-200"></div>
        </div>
        <button id="auth-btn" onclick="toggleAuthModal()" class="bg-brand-green hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm shadow">เข้าสู่ระบบ</button>
        <button onclick="toggleSidebar()" class="lg:hidden p-2 bg-blue-800 rounded"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 bg-slate-100">
      <div class="space-y-6">
        
        <!-- ข่าวประชาสัมพันธ์ -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-base font-bold text-brand-blue flex items-center"><span class="w-2 h-2 bg-red-500 rounded-full mr-2 animate-pulse"></span>ข่าวประชาสัมพันธ์ล่าสุด</h3>
          </div>
          <div id="news-container" class="flex space-x-4 overflow-x-auto pb-2"><p class="text-xs text-slate-400">กำลังโหลด...</p></div>
        </div>

        <!-- Dashboard -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-5 pb-4 border-b">
            <h2 class="text-xl font-bold text-brand-blue">Dashboard ภาพรวมสถานศึกษา</h2>
            <select id="school-filter" onchange="renderDashboard()" class="text-sm border rounded p-2 bg-slate-50"></select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-slate-50 border-l-4 border-brand-blue p-4 rounded-lg shadow-sm"><p class="text-xs font-bold text-slate-500">จำนวนนักเรียน</p><h3 id="card1-total" class="text-3xl font-extrabold text-brand-blue my-2">0</h3></div>
            <div class="bg-slate-50 border-l-4 border-purple-600 p-4 rounded-lg shadow-sm"><p class="text-xs font-bold text-slate-500">ผู้บริหารสถานศึกษา</p><h3 id="card2-total" class="text-3xl font-extrabold text-purple-600 my-2">0</h3></div>
            <div class="bg-slate-50 border-l-4 border-green-600 p-4 rounded-lg shadow-sm"><p class="text-xs font-bold text-slate-500">พนักงานครู</p><h3 id="card3-total" class="text-3xl font-extrabold text-green-600 my-2">0</h3></div>
            <div class="bg-slate-50 border-l-4 border-amber-500 p-4 rounded-lg shadow-sm"><p class="text-xs font-bold text-slate-500">บุคลากรทางการศึกษา</p><h3 id="card4-total" class="text-3xl font-extrabold text-amber-500 my-2">0</h3></div>
          </div>
          <div id="student-levels-grid" class="grid grid-cols-2 sm:grid-cols-6 gap-3 mb-6"></div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 border-t pt-6">
            <div class="w-full h-80 relative"><canvas id="studentBarChart"></canvas></div>
            <div class="w-full h-80 relative"><canvas id="personnelBarChart"></canvas></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-64 bg-slate-900 text-white fixed right-0 top-0 h-full shadow-2xl flex flex-col z-40 transform translate-x-full lg:translate-x-0 transition-transform">
    <div class="p-4 border-b border-slate-800 flex justify-center"><img src="SV_logo.png" alt="Logo" class="h-16"></div>
    <nav class="flex-1 p-3 space-y-2 overflow-y-auto text-sm">
      <a href="index.html" class="block px-3 py-2 rounded-md font-medium bg-brand-blue text-white">หน้าแรก</a>
      <a href="curriculum.html" class="block px-3 py-2 rounded-md font-medium hover:bg-slate-800 text-slate-300">ระบบงานหลักสูตร</a>
      <!-- ปุ่มข่าวประชาสัมพันธ์ซ่อนไว้สำหรับแอดมิน -->
      <button id="menu-news" onclick="NewsSystem.openList()" class="hidden w-full text-left px-3 py-2 rounded-md font-medium hover:bg-slate-800 text-amber-400 mt-4 border-t border-slate-700 pt-4">จัดการข่าวประชาสัมพันธ์</button>
    </nav>
  </aside>

  <!-- LOADING & AUTH MODALS -->
  <div id="global-loader" class="fixed inset-0 bg-slate-900 bg-opacity-40 hidden items-center justify-center z-[100]"><div class="bg-white px-6 py-4 rounded-xl shadow-xl"><span class="text-xs font-bold text-slate-700">กำลังโหลด...</span></div></div>
  <div id="login-modal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden items-center justify-center z-50"><div class="bg-white rounded-lg p-6 w-80"><h3 class="font-bold mb-4">เข้าสู่ระบบ</h3><input type="text" id="login-username" class="w-full border p-2 text-sm mb-2" placeholder="Username"><input type="password" id="login-password" class="w-full border p-2 text-sm mb-4" placeholder="Password"><div id="login-error" class="text-xs text-red-500 hidden mb-2"></div><div class="flex justify-end gap-2"><button onclick="toggleAuthModal()" class="px-3 py-1 border rounded text-xs">ยกเลิก</button><button onclick="performLogin()" class="px-3 py-1 bg-brand-blue text-white rounded text-xs">ตกลง</button></div></div></div>

  <!-- NEWS MODALS -->
  <div id="news-detail-modal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden items-center justify-center z-50"><div class="bg-white rounded-lg p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto"><h3 id="detail-news-title" class="font-bold text-brand-blue mb-2"></h3><div id="detail-news-image-container" class="mb-4"></div><p id="detail-news-content" class="text-sm whitespace-pre-line"></p><button onclick="NewsSystem.closeDetail()" class="mt-4 px-4 py-1.5 bg-slate-600 text-white rounded text-xs">ปิด</button></div></div>
  <div id="news-list-modal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden items-center justify-center z-50"><div class="bg-white rounded-lg p-6 w-full max-w-3xl max-h-[90vh] flex flex-col"><div class="flex justify-between mb-4"><h3 class="font-bold">จัดการข่าว</h3><div><button onclick="NewsSystem.closeList()" class="px-3 py-1 border rounded text-xs mr-2">ปิด</button><button onclick="NewsSystem.openForm()" class="px-3 py-1 bg-brand-blue text-white rounded text-xs">+ เพิ่มข่าว</button></div></div><div class="overflow-y-auto"><table class="w-full text-xs text-left"><tbody id="admin-news-table-body" class="divide-y"></tbody></table></div></div></div>
  <div id="news-form-modal" class="fixed inset-0 bg-slate-900 bg-opacity-70 hidden items-center justify-center z-[55]"><div class="bg-white rounded-lg p-6 w-full max-w-md"><h3 id="news-form-header" class="font-bold mb-4">ฟอร์มข่าว</h3><form id="news-form" class="space-y-3" onsubmit="event.preventDefault();"><input type="hidden" id="news-id"><input type="text" id="news-title" class="w-full border p-2 text-xs" placeholder="พาดหัวข่าว" required><textarea id="news-content" rows="4" class="w-full border p-2 text-xs" placeholder="เนื้อหา" required></textarea><input type="file" id="news-image" accept="image/jpeg, image/jpg" class="w-full border p-2 text-xs"><input type="date" id="news-date" class="w-full border p-2 text-xs" required></form><div class="flex justify-end gap-2 mt-4"><button onclick="NewsSystem.closeForm()" class="px-3 py-1 border rounded text-xs">ยกเลิก</button><button onclick="NewsSystem.saveData(this)" class="px-3 py-1 bg-green-600 text-white rounded text-xs">บันทึก</button></div></div></div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyUbL4Aq6p4CP2u4KdWurx42-r75eSzAZeLVhAeL8xBBblseSv7IOUEZ31b8XVHtqA/exec";
    let dbData = { units: [], students: [], personnel: [], news: [] };
    let currentUser = null;
    let levelChartInstances = {};

    window.onload = () => {
      const savedUser = localStorage.getItem('supervision_user');
      if (savedUser) try { currentUser = JSON.parse(savedUser); } catch(e){}
      updateAuthUI();
      fetchData();
      if(typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels);
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('translate-x-full');
      document.getElementById('sidebar-overlay').classList.toggle('hidden');
    }

    function toggleAuthModal() {
      if (currentUser) {
        currentUser = null; localStorage.removeItem('supervision_user');
        updateAuthUI(); window.location.reload();
      } else {
        document.getElementById('login-modal').classList.toggle('hidden');
        document.getElementById('login-modal').classList.toggle('flex');
      }
    }

    function performLogin() {
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      document.getElementById('global-loader').classList.replace('hidden', 'flex');
      fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: u, password: p }) })
      .then(res => res.json()).then(res => {
        document.getElementById('global-loader').classList.replace('flex', 'hidden');
        if (res.status === 'success') {
          currentUser = res.user; localStorage.setItem('supervision_user', JSON.stringify(currentUser));
          toggleAuthModal(); updateAuthUI();
        } else {
          document.getElementById('login-error').innerText = res.message;
          document.getElementById('login-error').classList.remove('hidden');
        }
      });
    }

    function updateAuthUI() {
      const btn = document.getElementById('auth-btn');
      const info = document.getElementById('user-info-display');
      if (currentUser) {
        btn.innerText = 'ออกจากระบบ'; btn.classList.replace('bg-brand-green', 'bg-red-600');
        info.classList.remove('hidden');
        document.getElementById('user-name').innerText = currentUser.name;
        document.getElementById('user-role').innerText = currentUser.role;
        if(currentUser.role === 'ผู้ดูแลระบบ') document.getElementById('menu-news').classList.remove('hidden');
      } else {
        btn.innerText = 'เข้าสู่ระบบ'; btn.classList.replace('bg-red-600', 'bg-brand-green');
        info.classList.add('hidden');
        document.getElementById('menu-news').classList.add('hidden');
      }
    }

    function fetchData() {
      document.getElementById('global-loader').classList.replace('hidden', 'flex');
      fetch(GAS_API_URL + "?action=getAllData").then(res => res.json()).then(data => {
        if (data.status === 'success') { dbData = data; renderDashboard(); NewsSystem.renderCards(); }
        document.getElementById('global-loader').classList.replace('flex', 'hidden');
      });
    }

    // -- DASHBOARD LOGIC --
    function renderSchoolDropdown() {
      const select = document.getElementById('school-filter');
      let html = '<option value="ALL">ภาพรวมสถานศึกษา</option>';
      (dbData.units || []).forEach(u => {
        if (u['ชื่อหน่วยงาน'].includes('โรงเรียน') || u['ชื่อหน่วยงาน'].includes('ศูนย์')) html += `<option value="${u['รหัสหน่วยงาน']}">${u['ชื่อหน่วยงาน']}</option>`;
      });
      select.innerHTML = html;
    }

    function renderDashboard() {
      const select = document.getElementById('school-filter');
      if (select.options.length <= 1) renderSchoolDropdown();
      const val = select.value;
      const f = d => val === 'ALL' ? (d['รหัสหน่วยงาน'] && (dbData.units.find(u=>u['รหัสหน่วยงาน']===d['รหัสหน่วยงาน']&&u['ชื่อหน่วยงาน'].includes('โรงเรียน')))) : d['รหัสหน่วยงาน'] === val;
      
      const std = (dbData.students || []).filter(f);
      const psn = (dbData.personnel || []).filter(f);

      const sum = (arr, cond) => arr.filter(cond).reduce((acc, curr) => acc + Number(curr['จำนวน'] || 0), 0);
      
      document.getElementById('card1-total').innerText = sum(std, ()=>true).toLocaleString();
      document.getElementById('card2-total').innerText = sum(psn, p=>['ผู้อำนวยการสถานศึกษา','รองผู้อำนวยการสถานศึกษา'].includes(p['ตำแหน่ง'])).toLocaleString();
      document.getElementById('card3-total').innerText = sum(psn, p=>['ครู','ครูผู้ช่วย'].includes(p['ตำแหน่ง'])).toLocaleString();
      document.getElementById('card4-total').innerText = sum(psn, p=>!['ผู้อำนวยการสถานศึกษา','รองผู้อำนวยการสถานศึกษา','ครู','ครูผู้ช่วย'].includes(p['ตำแหน่ง'])).toLocaleString();

      renderStudentLevelCharts(std);
      renderPersonnelBarChart(psn);
    }
    function renderStudentLevelCharts(std){/* กราฟนักเรียนแบบเดิม */}
    function renderPersonnelBarChart(psn){/* กราฟบุคลากรแบบเดิม */}

    // -- NEWS LOGIC --
    const NewsSystem = {
      isoToThai: iso => iso ? `${parseInt(iso.split('-')[2])} ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][parseInt(iso.split('-')[1])-1]} ${parseInt(iso.split('-')[0])<2500 ? parseInt(iso.split('-')[0])+543 : parseInt(iso.split('-')[0])}` : '',
      thaiToIso: th => { if(!th||th.includes('-')) return th; const p=th.split(' '); return `${parseInt(p[2])<2500?parseInt(p[2])+543:parseInt(p[2])-543}-${String(['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'].indexOf(p[1])+1).padStart(2,'0')}-${p[0].padStart(2,'0')}`;},
      renderCards: function() {
        const c = document.getElementById('news-container');
        c.innerHTML = (dbData.news||[]).sort((a,b)=>new Date(this.thaiToIso(b['วันที่']))-new Date(this.thaiToIso(a['วันที่']))).map(n => `
          <div class="min-w-[250px] bg-slate-50 rounded border p-2 cursor-pointer flex" onclick="NewsSystem.openDetail('${n['ลำดับ']}')">
            <img src="${n['ภาพข่าว']||'SV_logo.png'}" class="w-16 h-16 object-cover bg-gray-200 mr-2" onerror="this.src='SV_logo.png'">
            <div class="text-xs"><p class="text-blue-500">${n['วันที่']}</p><p class="font-bold line-clamp-1">${n['พาดหัวข่าว']}</p></div>
          </div>`).join('');
      },
      openDetail: function(id) { const n = dbData.news.find(x=>x['ลำดับ']==id); document.getElementById('detail-news-title').innerText=n['พาดหัวข่าว']; document.getElementById('detail-news-content').innerText=n['เนื้อหาข่าว']; document.getElementById('detail-news-image-container').innerHTML=`<img src="${n['ภาพข่าว']}" class="w-full">`; document.getElementById('news-detail-modal').classList.replace('hidden','flex'); },
      closeDetail: () => document.getElementById('news-detail-modal').classList.replace('flex','hidden'),
      openList: function(){ this.renderTable(); document.getElementById('news-list-modal').classList.replace('hidden','flex'); },
      closeList: () => document.getElementById('news-list-modal').classList.replace('flex','hidden'),
      renderTable: function() { document.getElementById('admin-news-table-body').innerHTML = dbData.news.map(n=>`<tr><td class="p-2">${n['วันที่']}</td><td class="p-2">${n['พาดหัวข่าว']}</td><td class="p-2"><button onclick="NewsSystem.openForm('${n['ลำดับ']}')" class="text-blue-500">แก้ไข</button></td></tr>`).join(''); },
      openForm: function(id=null) { document.getElementById('news-form').reset(); document.getElementById('news-id').value=id||''; document.getElementById('news-form-modal').classList.replace('hidden','flex'); this.closeList(); },
      closeForm: function() { document.getElementById('news-form-modal').classList.replace('flex','hidden'); this.openList(); },
      saveData: function(btn) {
        const id=document.getElementById('news-id').value, t=document.getElementById('news-title').value, c=document.getElementById('news-content').value, d=document.getElementById('news-date').value, f=document.getElementById('news-image');
        btn.innerText='...'; btn.disabled=true;
        const ex = (b64) => {
          fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:id?'updateNews':'saveData', sheetName:'ข่าวประชาสัมพันธ์', id:id, rowObj:{'พาดหัวข่าว':t,'เนื้อหาข่าว':c,'วันที่':this.isoToThai(d), 'ภาพข่าว':b64}})})
          .then(()=>fetchData()).finally(()=>{this.closeForm(); btn.innerText='บันทึก'; btn.disabled=false;});
        };
        if(f.files[0]) { const r=new FileReader(); r.onload=e=>ex(e.target.result); r.readAsDataURL(f.files[0]); } else ex('');
      }
    };
  </script>
</body>
</html>
