<div class="space-y-6 pb-10">
  
  <!-- การ์ดที่ 1: ข้อมูลหลักสูตรสถานศึกษา (รวบ Header และ Container ไว้ในกล่องเดียว) -->
  <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    
    <!-- ส่วน Header และปุ่มเพิ่ม -->
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-100 pb-5 mb-5">
      <div class="border-l-4 border-brand-blue pl-3">
        <h2 class="text-xl font-bold text-brand-blue tracking-tight">ข้อมูลหลักสูตรสถานศึกษา</h2>
        <p class="text-xs text-slate-500 mt-1">จัดการข้อมูลและเอกสารหลักสูตรของสถานศึกษา</p>
      </div>
      <div>
        <button onclick="CurriculumSystem.openForm()" class="px-4 py-2 bg-brand-blue text-white rounded-lg text-sm hover:bg-blue-800 font-semibold shadow-sm transition w-full sm:w-auto flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          เพิ่มหลักสูตร
        </button>
      </div>
    </div>

    <!-- ส่วนที่ JavaScript จะนำข้อมูลมาแสดง -->
    <div id="curriculum-container" class="space-y-3">
      <!-- การ์ดจะถูกสร้างด้วย JavaScript -->
    </div>

  </div>
  <!-- จบการ์ดที่ 1 -->

  <!-- การ์ดที่ 2: คู่มือและเอกสารวิชาการด้านหลักสูตร -->
  <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-100 pb-5 mb-5">
      <div class="border-l-4 border-amber-500 pl-3">
        <h2 class="text-xl font-bold text-amber-600 tracking-tight">คู่มือและเอกสารวิชาการด้านหลักสูตร</h2>
        <p class="text-xs text-slate-500 mt-1">คลังเอกสาร คู่มือ และสื่อวิชาการที่เกี่ยวข้องกับหลักสูตร</p>
      </div>
      <div id="add-manual-btn-container" class="hidden">
        <button onclick="ManualSystem.openForm()" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-sm hover:bg-amber-600 font-semibold shadow-sm transition w-full sm:w-auto flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          เพิ่มเอกสาร
        </button>
      </div>
    </div>

    <!-- ชั้นหนังสือ (Bookshelf Grid) -->
    <div id="manual-bookshelf-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
      <!-- ข้อมูลหนังสือจะถูกแทรกที่นี่ด้วย JS -->
    </div>
  </div>


  <!-- MODAL: ฟอร์มเพิ่ม/แก้ไข หลักสูตร -->
  <div id="curriculum-form-modal" class="fixed inset-0 bg-slate-900 bg-opacity-70 hidden items-center justify-center z-[55]">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl space-y-4 border-t-4 border-brand-blue max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="curriculum-form-header" class="text-base font-bold text-slate-800">จัดการข้อมูลหลักสูตร</h3>
        <button onclick="CurriculumSystem.closeForm()" class="text-slate-400 hover:text-slate-600 font-bold">X</button>
      </div>
      
      <form id="curriculum-form" class="space-y-3" onsubmit="event.preventDefault();">
        
        <!-- กล่องสำหรับแสดง Error สีแดง -->
        <div id="curriculum-error-msg" class="hidden bg-red-50 text-red-600 border border-red-200 text-xs p-2 rounded text-center font-bold"></div>
        
        <input type="hidden" id="curriculum-id">
        <div>
          <label class="block text-xs font-semibold mb-1">รหัสสถานศึกษา <span class="text-slate-400 font-normal">(ดึงอัตโนมัติ)</span></label>
          <input type="text" id="curriculum-school-id" class="w-full border border-slate-200 rounded px-3 py-1.5 text-xs bg-slate-100 text-slate-500 cursor-not-allowed" readonly>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">ชื่อหลักสูตร</label>
          <input type="text" id="curriculum-title" class="w-full border rounded px-3 py-1.5 text-xs focus:ring-2 focus:ring-brand-blue" required>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">ระดับการศึกษา</label>
            <select id="curriculum-level" class="w-full border rounded px-3 py-1.5 text-xs focus:ring-2 focus:ring-brand-blue bg-white" required>
              <option value="" disabled selected>เลือก...</option>
              <option value="ปฐมวัย">ปฐมวัย</option>
              <option value="ประถมศึกษา">ประถมศึกษา</option>
              <option value="มัธยมศึกษา">มัธยมศึกษา</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">ปีการศึกษา</label>
            <input type="number" id="curriculum-year" class="w-full border rounded px-3 py-1.5 text-xs focus:ring-2 focus:ring-brand-blue" min="2500" max="2600" required>
          </div>
        </div>
        <div class="pt-2">
          <label class="block text-xs font-semibold mb-1">เอกสารหลักสูตร (PDF เท่านั้น)</label>
          <input type="file" id="curriculum-file" accept="application/pdf" class="w-full border rounded px-3 py-1.5 text-xs file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-[10px] file:font-semibold file:bg-blue-50 file:text-brand-blue hover:file:bg-blue-100">
          <p id="curriculum-file-hint" class="text-[10px] text-slate-400 mt-1 hidden">มีไฟล์แนบเดิมอยู่แล้ว หากไม่ต้องการเปลี่ยน ไม่ต้องเลือกไฟล์ใหม่</p>
        </div>
      </form>
      <div class="flex justify-end space-x-2 pt-4 border-t mt-4">
        <button onclick="CurriculumSystem.closeForm()" class="px-3 py-1.5 border rounded text-xs hover:bg-slate-100 font-semibold">ยกเลิก</button>
        <button onclick="CurriculumSystem.saveData(this)" class="px-4 py-1.5 bg-brand-blue text-white rounded text-xs hover:bg-blue-800 font-semibold transition shadow-sm">บันทึกข้อมูล</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ฟอร์มเพิ่มคู่มือและเอกสาร -->
  <div id="manual-form-modal" class="fixed inset-0 bg-slate-900 bg-opacity-70 hidden items-center justify-center z-[55]">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl space-y-4 border-t-4 border-amber-500 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-base font-bold text-slate-800">เพิ่มคู่มือและเอกสารวิชาการ</h3>
        <button onclick="ManualSystem.closeForm()" class="text-slate-400 hover:text-slate-600 font-bold">X</button>
      </div>
      
      <form id="manual-form" class="space-y-3" onsubmit="event.preventDefault();">
        <div id="manual-error-msg" class="hidden bg-red-50 text-red-600 border border-red-200 text-xs p-2 rounded text-center font-bold"></div>
        
        <div>
          <label class="block text-xs font-semibold mb-1">ชื่อเอกสาร <span class="text-red-500">*</span></label>
          <input type="text" id="manual-title" class="w-full border rounded px-3 py-1.5 text-xs focus:ring-2 focus:ring-amber-500" required>
        </div>
        <div class="pt-2 border-t border-slate-100">
          <label class="block text-xs font-semibold mb-1 text-slate-700">ภาพหน้าปก (ไฟล์รูปภาพ)</label>
          <input type="file" id="manual-cover" accept="image/*" class="w-full border rounded px-3 py-1.5 text-xs file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-[10px] file:font-semibold file:bg-amber-50 file:text-amber-600 hover:file:bg-amber-100">
        </div>
        <div class="pt-2">
          <label class="block text-xs font-semibold mb-1 text-slate-700">ไฟล์เอกสาร (PDF) <span class="text-red-500">*</span></label>
          <input type="file" id="manual-file" accept="application/pdf" class="w-full border rounded px-3 py-1.5 text-xs file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-[10px] file:font-semibold file:bg-blue-50 file:text-brand-blue hover:file:bg-blue-100" required>
        </div>
      </form>
      <div class="flex justify-end space-x-2 pt-4 border-t mt-4">
        <button onclick="ManualSystem.closeForm()" class="px-3 py-1.5 border rounded text-xs hover:bg-slate-100 font-semibold">ยกเลิก</button>
        <button onclick="ManualSystem.saveData(this)" class="px-4 py-1.5 bg-amber-500 text-white rounded text-xs hover:bg-amber-600 font-semibold transition shadow-sm">อัปโหลดเอกสาร</button>
      </div>
    </div>
  </div>

</div>
