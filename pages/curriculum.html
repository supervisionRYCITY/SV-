<div class="space-y-6 pb-10">
  
  <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-l-4 border-brand-blue">
    <div>
      <h2 class="text-xl font-bold text-brand-blue tracking-tight">ข้อมูลหลักสูตรสถานศึกษา</h2>
      <p class="text-xs text-slate-500 mt-1">จัดการข้อมูลและเอกสารหลักสูตรของสถานศึกษา</p>
    </div>
    <div>
      <button onclick="CurriculumSystem.openForm()" class="px-4 py-2 bg-brand-blue text-white rounded-lg text-sm hover:bg-blue-800 font-semibold shadow-sm transition w-full sm:w-auto flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        เพิ่มหลักสูตร
      </button>
    </div>
  </div>

  <div id="curriculum-container" class="space-y-3">
    <!-- การ์ดจะถูกสร้างด้วย JavaScript -->
  </div>

  <!-- MODAL: ฟอร์มเพิ่ม/แก้ไข หลักสูตร -->
  <div id="curriculum-form-modal" class="fixed inset-0 bg-slate-900 bg-opacity-70 hidden items-center justify-center z-[55]">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl space-y-4 border-t-4 border-brand-blue max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="curriculum-form-header" class="text-base font-bold text-slate-800">จัดการข้อมูลหลักสูตร</h3>
        <button onclick="CurriculumSystem.closeForm()" class="text-slate-400 hover:text-slate-600 font-bold">X</button>
      </div>
      
      <form id="curriculum-form" class="space-y-3" onsubmit="event.preventDefault();">
        
        <!-- กล่องสำหรับแสดง Error สีแดง (ตัวปัญหาคือขาดแท็กนี้ไปครับ) -->
        <div id="curriculum-error-msg" class="hidden bg-red-50 text-red-600 border border-red-200 text-xs p-2 rounded text-center font-bold"></div>
        
        <input type="hidden" id="curriculum-id">
        <div>
          <label class="block text-xs font-semibold mb-1">รหัสสถานศึกษา <span class="text-slate-400 font-normal">(ดึงอัตโนมัติ)</span></label>
          <input type="text" id="curriculum-school-id" class="w-full border border-slate-200 rounded px-3 py-1.5 text-xs bg-slate-100 text-slate-500 cursor-not-allowed" readonly>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">ชื่อหลักสูตร</label>
          <input type="text" id="curriculum-title" class="w-full border rounded px-3 py-1.5 text-xs focus:ring-2 focus:ring-brand-blue" required>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1">ระดับการศึกษา</label>
            <select id="curriculum-level" class="w-full border rounded px-3 py-1.5 text-xs focus:ring-2 focus:ring-brand-blue bg-white" required>
              <option value="" disabled selected>เลือก...</option>
              <option value="ปฐมวัย">ปฐมวัย</option>
              <option value="ประถมศึกษา">ประถมศึกษา</option>
              <option value="มัธยมศึกษา">มัธยมศึกษา</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">ปีการศึกษา</label>
            <input type="number" id="curriculum-year" class="w-full border rounded px-3 py-1.5 text-xs focus:ring-2 focus:ring-brand-blue" min="2500" max="2600" required>
          </div>
        </div>
        <div class="pt-2">
          <label class="block text-xs font-semibold mb-1">เอกสารหลักสูตร (PDF เท่านั้น)</label>
          <input type="file" id="curriculum-file" accept="application/pdf" class="w-full border rounded px-3 py-1.5 text-xs file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-[10px] file:font-semibold file:bg-blue-50 file:text-brand-blue hover:file:bg-blue-100">
          <p id="curriculum-file-hint" class="text-[10px] text-slate-400 mt-1 hidden">มีไฟล์แนบเดิมอยู่แล้ว หากไม่ต้องการเปลี่ยน ไม่ต้องเลือกไฟล์ใหม่</p>
        </div>
      </form>
      <div class="flex justify-end space-x-2 pt-4 border-t mt-4">
        <button onclick="CurriculumSystem.closeForm()" class="px-3 py-1.5 border rounded text-xs hover:bg-slate-100 font-semibold">ยกเลิก</button>
        <button onclick="CurriculumSystem.saveData(this)" class="px-4 py-1.5 bg-brand-blue text-white rounded text-xs hover:bg-blue-800 font-semibold transition shadow-sm">บันทึกข้อมูล</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ยืนยันการลบ -->
  <div id="curr-confirm-modal" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden items-center justify-center z-[60]">
    <div class="bg-white rounded-lg p-6 w-80 shadow-2xl space-y-4 border-t-4 border-red-500 text-center">
      <div class="text-red-500 mb-2">
        <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      </div>
      <h3 class="text-base font-bold text-slate-800">ยืนยันการลบหลักสูตร?</h3>
      <p class="text-[11px] text-slate-500" id="curr-confirm-delete-text">คุณต้องการลบหลักสูตรนี้ใช่หรือไม่</p>
      <div class="flex justify-center space-x-3 pt-4">
        <button onclick="CurriculumSystem.closeConfirm()" class="px-5 py-2 border rounded-md text-xs font-semibold hover:bg-slate-100">ยกเลิก</button>
        <button id="curr-btn-confirm-delete" onclick="CurriculumSystem.executeDelete()" class="px-5 py-2 bg-red-600 text-white rounded-md text-xs font-semibold hover:bg-red-700 transition shadow-sm">ยืนยันลบ</button>
      </div>
    </div>
  </div>

</div>
